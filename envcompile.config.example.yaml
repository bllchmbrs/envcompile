version: 1

privateDir: source_env_vars
publicDir: public_env_vars
keysDir: ~/secrets/my-app

environments:
  - dev
  - staging
  - prod

keyFilePatterns:
  source: '{env}/.env.{source}.keys'

targets:
  api:
    description: Runtime env for API deployment
    output: compiled_env/{env}/.env.api
    sources:
      - stripe
      - cloudflare
    publicSources:
      - defaults
    required:
      - STRIPE_SECRET_KEY
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ZONE_ID
    duplicatePolicy: error
    ordering: config

  web:
    description: Runtime env for web deployment
    output: compiled_env/{env}/.env.web
    sources:
      - stripe
    required:
      - STRIPE_PUBLISHABLE_KEY
    duplicatePolicy: error
    ordering: config
